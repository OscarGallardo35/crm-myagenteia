server {
    listen 80;
    server_name crm.mercadodigital.pro;
    root /usr/share/nginx/html;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    client_max_body_size 10M;

    # No cache para HTML (siempre fresco)
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        try_files $uri $uri/ /index.html;
    }

    # Archivos estáticos con cache pero versionados
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Redirect /api/chats/ → /api/chat/chats/ etc. (para que coincida con lo que espera el frontend)
    # El frontend usa /api/chats/, /api/leads/, /api/posts/, /api/scheduled/, /api/agents/, /api/dashboard/
    # pero el backend tiene los endpoints en /api/chat/chats/, /api/chat/leads/, etc.
    location = /api/chats/ {
        proxy_pass http://backend:8000/api/chat/chats/;
    }
    location = /api/leads/ {
        proxy_pass http://backend:8000/api/chat/leads/;
    }
    location = /api/posts/ {
        proxy_pass http://backend:8000/api/chat/posts/;
    }
    location = /api/scheduled/ {
        proxy_pass http://backend:8000/api/chat/scheduled/;
    }
    location = /api/agents/ {
        proxy_pass http://backend:8000/api/chat/agents/;
    }
    location = /api/dashboard/ {
        proxy_pass http://backend:8000/api/chat/dashboard/;
    }
    location /api/chats/ {
        rewrite ^/api/chats/(.*)$ /api/chat/chats/$1 break;
        proxy_pass http://backend:8000;
    }
    location /api/leads/ {
        rewrite ^/api/leads/(.*)$ /api/chat/leads/$1 break;
        proxy_pass http://backend:8000;
    }
    location /api/posts/ {
        rewrite ^/api/posts/(.*)$ /api/chat/posts/$1 break;
        proxy_pass http://backend:8000;
    }
    location /api/scheduled/ {
        rewrite ^/api/scheduled/(.*)$ /api/chat/scheduled/$1 break;
        proxy_pass http://backend:8000;
    }
    location /api/agents/ {
        rewrite ^/api/agents/(.*)$ /api/chat/agents/$1 break;
        proxy_pass http://backend:8000;
    }
    location /api/dashboard/ {
        rewrite ^/api/dashboard/(.*)$ /api/chat/dashboard/$1 break;
        proxy_pass http://backend:8000;
    }

    # API Backend genérico (auth, conversations, etc. — fallback si no matchea un bloque específico)
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_connect_timeout 30s;
        proxy_buffering off;
    }

    # API Backend (rutas que empiezan con /api/chat/)
    location /api/chat/ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # El agente Hermes puede tardar (ejecuta tools); no cortar con 504.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_connect_timeout 30s;
        proxy_buffering off;
    }

    # API Backend genérico
    location /api/conversations/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_connect_timeout 30s;
        proxy_buffering off;
    }

    # Admin Django
    location /admin/ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static files Django
    location /static/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }
}
