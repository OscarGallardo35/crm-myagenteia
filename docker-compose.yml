# CRM MyAgenteIA - Docker Compose (simplificado)
version: '3.8'

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: myagenteia_crm
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  backend:
    build: ./backend
    command: >
      sh -c "python manage.py migrate --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --threads 2"
    ports:
      - "8000:8000"
    volumes:
      - /root/.hermes:/hermes:ro
      - /var/log:/var/log/hostlogs:ro
      - ./media:/app/media
    environment:
      DB_NAME: myagenteia_crm
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: db
      DB_PORT: 5432
      SSH_AUTH_LOG: /var/log/hostlogs/auth.log
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: django-insecure-change-me-in-production
      DEBUG: "false"
      ALLOWED_HOSTS: crm.mercadodigital.pro,localhost
      HERMES_STATE_DB: /hermes/state.db
      HERMES_MODELS_JSON: /hermes/crm/models.json
      HERMES_PROXY_URL: http://10.0.3.1:8645/v1
      HERMES_PROXY_MODEL: meituan/longcat-2.0:free
      HERMES_GATEWAY_URL: http://10.0.3.1:8642/v1
      HERMES_GATEWAY_MODEL: hermes-agent
      HERMES_ENV_FILE: /hermes/.env
    healthcheck:
      test: ["CMD", "curl", "-f", "-L", "http://localhost:8000/api/"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    ports:
      - "8083:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
